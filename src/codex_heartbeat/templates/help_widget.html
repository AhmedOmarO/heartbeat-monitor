<div id="help-popover" class="help-popover" role="tooltip" hidden></div>
<script>
(() => {
  const popover = document.getElementById('help-popover');
  let active = null;
  let pinned = false;

  function close(force = false) {
    if (pinned && !force) return;
    if (active) active.removeAttribute('aria-describedby');
    active = null;
    pinned = false;
    popover.hidden = true;
  }

  function open(button) {
    if (active && active !== button) active.removeAttribute('aria-describedby');
    active = button;
    popover.textContent = button.dataset.help;
    popover.hidden = false;
    button.setAttribute('aria-describedby', 'help-popover');
    const rect = button.getBoundingClientRect();
    const width = popover.offsetWidth;
    const height = popover.offsetHeight;
    popover.style.left = Math.max(12, Math.min(rect.left, innerWidth - width - 12)) + 'px';
    popover.style.top = (rect.bottom + height + 10 < innerHeight ? rect.bottom + 8 : rect.top - height - 8) + 'px';
  }

  for (const button of document.querySelectorAll('.info')) {
    button.setAttribute('aria-label', `${button.dataset.term}: ${button.dataset.help}`);
    button.addEventListener('mouseenter', () => { if (!pinned) open(button); });
    button.addEventListener('mouseleave', () => close());
    button.addEventListener('focus', () => { pinned = false; open(button); });
    button.addEventListener('blur', () => close());
    button.addEventListener('click', event => {
      event.stopPropagation();
      if (pinned && active === button) close(true);
      else { pinned = true; open(button); }
    });
  }
  document.addEventListener('click', event => { if (!event.target.closest('.info')) close(true); });
  document.addEventListener('keydown', event => { if (event.key === 'Escape') close(true); });
})();
</script>
